<!DOCTYPE html>
<html lang="en" data-theme="espresso">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>App Launch Procedure & Pre-Flight Operator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Playfair+Display:ital,wght@0,600;0,700;1,400&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  
  <style>
    /* ==========================================================================
       THEME ENGINE & CSS DESIGN SYSTEM
       ========================================================================== */
    :root, [data-theme="espresso"] {
      --bg-base: #14110f;
      --bg-surface: #1e1916;
      --bg-surface-elevated: #29221e;
      --border-subtle: #3a302a;
      --border-strong: #5a4b42;
      --text-main: #f5ebe6;
      --text-muted: #a6958b;
      --text-dim: #706259;
      --accent: #d97736;
      --accent-hover: #eb8b4d;
      --accent-glow: rgba(217, 119, 54, 0.18);
      --badge-bg: #342822;
      --state-pending: #4a3e37;
      --state-progress: #d97736;
      --state-complete: #38a169;
      --font-display: 'Playfair Display', serif;
      --font-body: 'Inter', sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
      --card-radius: 12px;
    }

    [data-theme="slate"] {
      --bg-base: #0b0f19;
      --bg-surface: #131b2e;
      --bg-surface-elevated: #1e2942;
      --border-subtle: #253352;
      --border-strong: #3b4f7a;
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --text-dim: #64748b;
      --accent: #38bdf8;
      --accent-hover: #7dd3fc;
      --accent-glow: rgba(56, 189, 248, 0.18);
      --badge-bg: #1c2a47;
      --state-pending: #334155;
      --state-progress: #0284c7;
      --state-complete: #10b981;
      --font-display: 'Space Grotesk', sans-serif;
      --font-body: 'Inter', sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
      --card-radius: 8px;
    }

    [data-theme="nordic"] {
      --bg-base: #f4f5f7;
      --bg-surface: #ffffff;
      --bg-surface-elevated: #fcfcfd;
      --border-subtle: #e2e8f0;
      --border-strong: #cbd5e1;
      --text-main: #0f172a;
      --text-muted: #475569;
      --text-dim: #94a3b8;
      --accent: #2563eb;
      --accent-hover: #3b82f6;
      --accent-glow: rgba(37, 99, 235, 0.12);
      --badge-bg: #eff6ff;
      --state-pending: #cbd5e1;
      --state-progress: #2563eb;
      --state-complete: #16a34a;
      --font-display: 'Cinzel', serif;
      --font-body: 'Inter', sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
      --card-radius: 10px;
    }

    /* Reset & Core Flow */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg-base);
      color: var(--text-main);
      font-family: var(--font-body);
      line-height: 1.5;
      padding: 24px 16px 64px 16px;
      transition: background-color 0.25s ease, color 0.25s ease;
    }

    .shell {
      max-width: 1140px;
      margin: 0 auto;
    }

    /* Header & Navigation Bar */
    header {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--card-radius);
      padding: 24px 28px;
      margin-bottom: 24px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.25);
    }

    .top-meta {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      border-bottom: 1px solid var(--border-subtle);
      padding-bottom: 18px;
      margin-bottom: 20px;
    }

    .brand-title {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-badge {
      background: var(--accent);
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      padding: 4px 8px;
      border-radius: 4px;
      letter-spacing: 0.08em;
    }

    h1 {
      font-family: var(--font-display);
      font-size: 26px;
      font-weight: 700;
      color: var(--text-main);
      letter-spacing: -0.01em;
    }

    /* Controls: Theme & Backups */
    .header-controls {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .theme-picker {
      display: flex;
      background: var(--bg-surface-elevated);
      border: 1px solid var(--border-subtle);
      border-radius: 30px;
      padding: 3px;
    }

    .theme-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 12px;
      font-weight: 600;
      padding: 6px 14px;
      border-radius: 20px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .theme-btn.active {
      background: var(--accent);
      color: #ffffff;
      box-shadow: 0 2px 8px var(--accent-glow);
    }

    .utility-btn {
      background: var(--bg-surface-elevated);
      border: 1px solid var(--border-subtle);
      color: var(--text-main);
      font-size: 12px;
      font-weight: 600;
      padding: 8px 14px;
      border-radius: 6px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }

    .utility-btn:hover {
      border-color: var(--border-strong);
      background: var(--border-subtle);
    }

    /* Domain Tabs */
    .domain-tabs-wrapper {
      margin-top: 10px;
    }

    .domain-tabs-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .domain-tabs-label {
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
    }

    .tabs-grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 8px;
    }

    @media (max-width: 900px) {
      .tabs-grid { grid-template-columns: repeat(3, 1fr); }
    }

    @media (max-width: 580px) {
      .tabs-grid { grid-template-columns: repeat(2, 1fr); }
    }

    .tab-btn {
      background: var(--bg-surface-elevated);
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      padding: 10px 12px;
      text-align: left;
      cursor: pointer;
      transition: all 0.2s;
      position: relative;
      overflow: hidden;
    }

    .tab-btn:hover {
      border-color: var(--border-strong);
    }

    .tab-btn.active {
      border-color: var(--accent);
      background: var(--bg-base);
      box-shadow: 0 0 0 1px var(--accent);
    }

    .tab-index {
      font-size: 10px;
      font-weight: 700;
      color: var(--accent);
      text-transform: uppercase;
      margin-bottom: 2px;
      display: block;
    }

    .tab-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-main);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      display: block;
    }

    .tab-score {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 4px;
      font-family: var(--font-mono);
    }

    /* Active Domain Banner */
    .domain-lead {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--card-radius);
      padding: 18px 24px;
      margin-bottom: 24px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
    }

    .domain-lead-info {
      flex: 1;
      min-width: 260px;
    }

    .domain-input-group {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 6px;
    }

    .domain-text-input {
      background: var(--bg-base);
      border: 1px solid var(--border-subtle);
      color: var(--text-main);
      font-family: var(--font-mono);
      font-size: 15px;
      font-weight: 600;
      padding: 8px 14px;
      border-radius: 6px;
      flex: 1;
      max-width: 380px;
    }

    .domain-text-input:focus {
      outline: none;
      border-color: var(--accent);
    }

    .progress-bar-container {
      width: 220px;
    }

    .progress-labels {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .progress-track {
      height: 8px;
      background: var(--bg-surface-elevated);
      border-radius: 4px;
      overflow: hidden;
      border: 1px solid var(--border-subtle);
    }

    .progress-fill {
      height: 100%;
      background: var(--accent);
      width: 0%;
      transition: width 0.3s ease;
    }

    /* Procedures List */
    .procedure-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--card-radius);
      margin-bottom: 20px;
      overflow: hidden;
      transition: border-color 0.2s;
    }

    .procedure-card:hover {
      border-color: var(--border-strong);
    }

    .procedure-card.card-completed {
      border-color: var(--state-complete);
    }

    .card-header {
      padding: 18px 24px;
      background: var(--bg-surface-elevated);
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .card-title-area {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .step-number {
      background: var(--badge-bg);
      border: 1px solid var(--border-subtle);
      color: var(--text-main);
      font-family: var(--font-mono);
      font-size: 12px;
      font-weight: 700;
      padding: 4px 8px;
      border-radius: 6px;
    }

    .card-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--text-main);
    }

    /* State Pills: Assigned / In Progress / Completed */
    .state-toggle-group {
      display: flex;
      background: var(--bg-base);
      border: 1px solid var(--border-subtle);
      border-radius: 20px;
      padding: 2px;
    }

    .state-toggle-btn {
      background: transparent;
      border: none;
      font-size: 11px;
      font-weight: 600;
      padding: 5px 12px;
      border-radius: 16px;
      cursor: pointer;
      color: var(--text-muted);
      transition: all 0.2s;
    }

    .state-toggle-btn.active-pending {
      background: var(--state-pending);
      color: #fff;
    }

    .state-toggle-btn.active-progress {
      background: var(--state-progress);
      color: #fff;
    }

    .state-toggle-btn.active-completed {
      background: var(--state-complete);
      color: #fff;
    }

    /* Instructions & Subtasks */
    .card-body {
      padding: 24px;
    }

    .instructions-box {
      background: var(--bg-base);
      border-left: 3px solid var(--accent);
      border-radius: 0 6px 6px 0;
      padding: 14px 18px;
      margin-bottom: 20px;
      font-size: 13.5px;
      color: var(--text-muted);
      line-height: 1.6;
    }

    .instructions-box strong {
      color: var(--text-main);
    }

    .subtasks-header {
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-muted);
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
    }

    .checklist-items {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 20px;
    }

    .check-label {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      cursor: pointer;
      font-size: 14px;
      color: var(--text-main);
      user-select: none;
    }

    .check-input {
      appearance: none;
      width: 18px;
      height: 18px;
      border: 1px solid var(--border-strong);
      border-radius: 4px;
      background: var(--bg-base);
      cursor: pointer;
      flex-shrink: 0;
      margin-top: 2px;
      position: relative;
      transition: all 0.15s ease;
    }

    .check-input:checked {
      background: var(--state-complete);
      border-color: var(--state-complete);
    }

    .check-input:checked::after {
      content: '✓';
      color: #ffffff;
      position: absolute;
      font-size: 13px;
      font-weight: 700;
      top: -1px;
      left: 3px;
    }

    .check-text {
      flex: 1;
      line-height: 1.45;
    }

    .check-input:checked + .check-text {
      color: var(--text-muted);
      text-decoration: line-through;
    }

    /* Step Notes Area */
    .step-notes-label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-dim);
      margin-bottom: 6px;
      display: block;
    }

    .step-notes-input {
      width: 100%;
      background: var(--bg-base);
      border: 1px solid var(--border-subtle);
      border-radius: 6px;
      color: var(--text-main);
      font-family: var(--font-body);
      font-size: 13px;
      padding: 10px 12px;
      resize: vertical;
      min-height: 52px;
    }

    .step-notes-input:focus {
      outline: none;
      border-color: var(--accent);
    }

    /* Hidden File Input for Restore */
    #import-file-input { display: none; }

    /* Footer Note */
    footer {
      text-align: center;
      margin-top: 40px;
      font-size: 12px;
      color: var(--text-dim);
    }
  </style>
</head>
<body>

<div class="shell">
  
  <!-- MAIN HEADER -->
  <header>
    <div class="top-meta">
      <div class="brand-title">
        <span class="brand-badge">Pre-Flight</span>
        <h1>Launch Procedure Engine</h1>
      </div>

      <div class="header-controls">
        <!-- Palette Switcher -->
        <div class="theme-picker" title="Switch Theme Palette">
          <button class="theme-btn active" onclick="setPalette('espresso')">Espresso</button>
          <button class="theme-btn" onclick="setPalette('slate')">Slate</button>
          <button class="theme-btn" onclick="setPalette('nordic')">Nordic</button>
        </div>

        <!-- Local Backup & Recovery -->
        <button class="utility-btn" onclick="exportDataJSON()" title="Export all 6 tabs to JSON">
          <span>↓ Export JSON</span>
        </button>
        <button class="utility-btn" onclick="triggerImport()" title="Import saved JSON">
          <span>↑ Restore</span>
        </button>
        <button class="utility-btn" onclick="resetCurrentTab()" title="Reset current tab checklist">
          <span>↺ Reset Tab</span>
        </button>
        <input type="file" id="import-file-input" accept=".json" onchange="importDataJSON(event)">
      </div>
    </div>

    <!-- DOMAIN TABS (TAB 1 TO TAB 6) -->
    <div class="domain-tabs-wrapper">
      <div class="domain-tabs-header">
        <span class="domain-tabs-label">Active Deployment Flights (6 Domains)</span>
        <span style="font-size:12px; color:var(--text-dim); font-family:var(--font-mono)">Private • LocalStorage Bound</span>
      </div>
      <div class="tabs-grid" id="tabs-bar">
        <!-- Rendered dynamically -->
      </div>
    </div>
  </header>

  <!-- ACTIVE DOMAIN SUMMARY BANNER -->
  <section class="domain-lead">
    <div class="domain-lead-info">
      <span style="font-size: 11px; font-weight: 700; color: var(--accent); text-transform: uppercase;">Configuring Domain Property</span>
      <div class="domain-input-group">
        <input type="text" id="domain-name-input" class="domain-text-input" placeholder="e.g. soletraderhub.com" oninput="updateDomainName(this.value)">
      </div>
    </div>

    <div class="progress-bar-container">
      <div class="progress-labels">
        <span>Flight Readiness</span>
        <span id="readiness-pct">0%</span>
      </div>
      <div class="progress-track">
        <div class="progress-fill" id="readiness-fill"></div>
      </div>
    </div>
  </section>

  <!-- MASTER PROCEDURES (STEPS 1 - 5) -->
  <main id="procedures-container">
    <!-- Rendered dynamically from configuration -->
  </main>

  <footer>
    <p>Freeware Rollout Stage Process Task Manager & Operator • Zero Server Callbacks • All Data Preserved Locally</p>
  </footer>

</div>

<script>
  /* ==========================================================================
     CANONICAL PROCEDURE SPECIFICATION (STEPS & DETAILED SUB-ACTIONS)
     ========================================================================== */
  const DEFAULT_STEPS = [
    {
      id: "step-1",
      number: "01",
      title: "Private Repository & Draft Shielding",
      instructions: "Ensure draft versions and early code experiments are completely hidden from the public and search bots. On GitHub, make the repo private. Vercel deploys private repos flawlessly on the free tier.",
      subtasks: [
        "Navigate to GitHub Repository Settings → Danger Zone → Change Visibility to Private",
        "Confirm Vercel project remains linked and builds successfully from the private repository",
        "Add <meta name='robots' content='noindex, nofollow'> to any unlaunched drafts currently live",
        "Delete or pause obsolete legacy .vercel.app projects that contain broken or unfinished versions"
      ]
    },
    {
      id: "step-2",
      number: "02",
      title: "Technical SEO & OpenGraph Card Verification",
      instructions: "Configure the single-file HTML document to render static intent-driven metadata. Google and social scrapers need static meta and social cards for previews before JavaScript executes.",
      subtasks: [
        "Set an exact intent-driven <title> tag (< 60 chars) highlighting offline privacy",
        "Provide a high-density <meta name='description'> (140–160 chars) summarizing core utility",
        "Set canonical link tag pointing to the authoritative production HTTPS domain",
        "Build and host an 'og-preview.png' image (1200x630px) displaying clean interface screenshots",
        "Include og:title, og:description, og:image, and twitter:card meta properties in document head",
        "Include static semantic H1 and H2 elements in the initial HTML for crawlability",
        "Deploy a valid 'robots.txt' and 'sitemap.xml' to the root directory allowing full indexation"
      ]
    },
    {
      id: "step-3",
      number: "03",
      title: "Custom Domain DNS & SSL Production Binding",
      instructions: "Route your custom domain to Vercel's edge network. Enforce standard redirects to ensure all link equity consolidates on one single authoritative URL.",
      subtasks: [
        "Register root domain via Cloudflare, Namecheap, or chosen registrar",
        "Add custom domain in Vercel Settings → Domains (apex and www)",
        "Configure DNS A-record to 76.76.21.21 or CNAME to cname.vercel-dns.com",
        "Enable 301 permanent redirect from 'www' to apex domain (or vice versa)",
        "Verify SSL/TLS certificate is generated and HTTPS is strictly enforced"
      ]
    },
    {
      id: "step-4",
      number: "04",
      title: "Local-First Storage & Disaster Recovery Verification",
      instructions: "Perform rigorous cold testing of client-side storage, backup reminders, and zero-server privacy before driving traffic to the live URL.",
      subtasks: [
        "Perform cold test in an Incognito / Private browser tab; confirm instant layout load",
        "Verify the Privacy / Local-First Onboarding banner clearly explains zero-server retention",
        "Generate mock business data (invoices, expenses, or notes) and test the 24-hour backup reminder",
        "Trigger JSON export file download and inspect the generated [app]-backup-YYYY-MM-DD.json",
        "Clear browser storage, import the JSON file, and confirm data rehydrates in under 1 second",
        "Test on mobile Safari (iOS) and Chrome (Android); confirm PDF, PNG, and JSON downloads trigger cleanly"
      ]
    },
    {
      id: "step-5",
      number: "05",
      title: "Search Console Registration, Analytics & Community Broadcast",
      instructions: "Alert search engine crawlers of the new domain, activate cookieless telemetry, and begin gentle problem-solving distribution in targeted communities.",
      subtasks: [
        "Verify domain ownership in Google Search Console via DNS TXT record or HTML tag",
        "Submit sitemap.xml in Google Search Console and inspect URL to verify bot rendering",
        "Import verified property into Bing Webmaster Tools to capture Yahoo and DuckDuckGo search traffic",
        "Confirm cookieless, privacy-friendly analytics script (Vercel / Umami / Plausible) is active",
        "Publish first entry in public /log or /updates devlog page summarizing the release",
        "Introduce the tool organically in freelance/sole-trader forums focusing on privacy and zero-account utility"
      ]
    }
  ];

  /* ==========================================================================
     STORAGE STRUCTURE & MULTI-TAB INITIALIZATION (6 TABS)
     ========================================================================== */
  const STORAGE_KEY = "roastery_launch_operator_v2";

  function initEmptyTab(index) {
    const defaultTitles = [
      "Sole Trader Hub",
      "AI Prompt Studio",
      "Audio & Sound Booth",
      "Digital Diary App",
      "Utility Tool Suite",
      "Creative Lab Workspace"
    ];

    const stepsState = {};
    DEFAULT_STEPS.forEach(s => {
      stepsState[s.id] = {
        state: "pending", // "pending" | "progress" | "completed"
        subtasks: new Array(s.subtasks.length).fill(false),
        notes: ""
      };
    });

    return {
      id: `tab-${index}`,
      index: index,
      title: defaultTitles[index - 1] || `App Domain ${index}`,
      domainName: index === 1 ? "soletraderhub.com" : "",
      steps: stepsState
    };
  }

  function loadAllState() {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) {
      const initial = {
        activeTab: 1,
        palette: "espresso",
        tabs: {}
      };
      for (let i = 1; i <= 6; i++) {
        initial.tabs[i] = initEmptyTab(i);
      }
      return initial;
    }
    try {
      return JSON.parse(raw);
    } catch (e) {
      console.error("Storage corrupted, rebuilding default state", e);
      localStorage.removeItem(STORAGE_KEY);
      return loadAllState();
    }
  }

  let AppState = loadAllState();

  function saveAllState() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(AppState));
    renderTabs();
    calculateReadiness();
  }

  /* ==========================================================================
     THEME CONTROLLER
     ========================================================================== */
  function setPalette(name) {
    document.documentElement.setAttribute('data-theme', name);
    AppState.palette = name;
    localStorage.setItem(STORAGE_KEY, JSON.stringify(AppState));

    document.querySelectorAll('.theme-btn').forEach(btn => {
      btn.classList.toggle('active', btn.textContent.toLowerCase() === name);
    });
  }

  /* ==========================================================================
     TAB CONTROLLER
     ========================================================================== */
  function switchTab(index) {
    AppState.activeTab = index;
    saveAllState();
    renderActiveTabContent();
  }

  function updateDomainName(val) {
    const currentTab = AppState.tabs[AppState.activeTab];
    currentTab.domainName = val;
    currentTab.title = val.trim() || `Domain ${AppState.activeTab}`;
    saveAllState();
  }

  function resetCurrentTab() {
    if (!confirm(`Reset all checklist items and states for Tab ${AppState.activeTab}?`)) return;
    AppState.tabs[AppState.activeTab] = initEmptyTab(AppState.activeTab);
    saveAllState();
    renderActiveTabContent();
  }

  /* ==========================================================================
     PROCEDURE ACTIONS & STATE MUTATIONS
     ========================================================================== */
  function setStepState(stepId, newState) {
    const currentTab = AppState.tabs[AppState.activeTab];
    currentTab.steps[stepId].state = newState;

    // If marked completed, check all subtasks automatically
    if (newState === 'completed') {
      const stepConfig = DEFAULT_STEPS.find(s => s.id === stepId);
      currentTab.steps[stepId].subtasks = new Array(stepConfig.subtasks.length).fill(true);
    }
    saveAllState();
    renderActiveTabContent();
  }

  function toggleSubtask(stepId, subIndex, checked) {
    const currentTab = AppState.tabs[AppState.activeTab];
    currentTab.steps[stepId].subtasks[subIndex] = checked;

    // If all subtasks checked, set progress to completed; if some checked, set to in-progress
    const allChecked = currentTab.steps[stepId].subtasks.every(Boolean);
    const anyChecked = currentTab.steps[stepId].subtasks.some(Boolean);

    if (allChecked) {
      currentTab.steps[stepId].state = 'completed';
    } else if (anyChecked) {
      currentTab.steps[stepId].state = 'progress';
    } else {
      currentTab.steps[stepId].state = 'pending';
    }

    saveAllState();
    renderActiveTabContent();
  }

  function updateStepNotes(stepId, text) {
    const currentTab = AppState.tabs[AppState.activeTab];
    currentTab.steps[stepId].notes = text;
    localStorage.setItem(STORAGE_KEY, JSON.stringify(AppState));
  }

  /* ==========================================================================
     COMPLETION & READINESS CALCULATOR
     ========================================================================== */
  function calculateTabScore(tab) {
    let totalSubtasks = 0;
    let completedSubtasks = 0;

    DEFAULT_STEPS.forEach(step => {
      totalSubtasks += step.subtasks.length;
      const userStep = tab.steps[step.id];
      if (userStep && userStep.subtasks) {
        completedSubtasks += userStep.subtasks.filter(Boolean).length;
      }
    });

    return totalSubtasks === 0 ? 0 : Math.round((completedSubtasks / totalSubtasks) * 100);
  }

  function calculateReadiness() {
    const currentTab = AppState.tabs[AppState.activeTab];
    const score = calculateTabScore(currentTab);

    const fill = document.getElementById("readiness-fill");
    const label = document.getElementById("readiness-pct");
    if (fill && label) {
      fill.style.width = `${score}%`;
      label.textContent = `${score}%`;
    }
  }

  /* ==========================================================================
     UI RENDERING ENGINE
     ========================================================================== */
  function renderTabs() {
    const tabsBar = document.getElementById("tabs-bar");
    tabsBar.innerHTML = "";

    for (let i = 1; i <= 6; i++) {
      const tab = AppState.tabs[i];
      const isActive = i === AppState.activeTab;
      const score = calculateTabScore(tab);

      const btn = document.createElement("button");
      btn.className = `tab-btn ${isActive ? 'active' : ''}`;
      btn.onclick = () => switchTab(i);
      btn.innerHTML = `
        <span class="tab-index">Tab ${i}</span>
        <span class="tab-title">${escapeHTML(tab.title)}</span>
        <span class="tab-score">${score}% Ready</span>
      `;
      tabsBar.appendChild(btn);
    }
  }

  function renderActiveTabContent() {
    const currentTab = AppState.tabs[AppState.activeTab];
    document.getElementById("domain-name-input").value = currentTab.domainName || "";

    const container = document.getElementById("procedures-container");
    container.innerHTML = "";

    DEFAULT_STEPS.forEach(step => {
      const userStep = currentTab.steps[step.id] || { state: 'pending', subtasks: [], notes: '' };
      const isCompleted = userStep.state === 'completed';

      const card = document.createElement("article");
      card.className = `procedure-card ${isCompleted ? 'card-completed' : ''}`;

      // Card Header
      const header = document.createElement("div");
      header.className = "card-header";
      header.innerHTML = `
        <div class="card-title-area">
          <span class="step-number">STEP ${step.number}</span>
          <h2 class="card-title">${step.title}</h2>
        </div>
        <div class="state-toggle-group">
          <button class="state-toggle-btn ${userStep.state === 'pending' ? 'active-pending' : ''}" 
                  onclick="setStepState('${step.id}', 'pending')">Planned</button>
          <button class="state-toggle-btn ${userStep.state === 'progress' ? 'active-progress' : ''}" 
                  onclick="setStepState('${step.id}', 'progress')">In Progress</button>
          <button class="state-toggle-btn ${userStep.state === 'completed' ? 'active-completed' : ''}" 
                  onclick="setStepState('${step.id}', 'completed')">Completed</button>
        </div>
      `;

      // Card Body
      const body = document.createElement("div");
      body.className = "card-body";

      // Instructions block
      const instructions = document.createElement("div");
      instructions.className = "instructions-box";
      instructions.innerHTML = `<strong>Operational Protocol:</strong> ${step.instructions}`;

      // Subtasks Checklist
      const subHeader = document.createElement("div");
      subHeader.className = "subtasks-header";
      subHeader.innerHTML = `
        <span>Action Verification Checklist</span>
        <span>${userStep.subtasks.filter(Boolean).length} / ${step.subtasks.length} Verified</span>
      `;

      const checklistContainer = document.createElement("div");
      checklistContainer.className = "checklist-items";

      step.subtasks.forEach((itemText, idx) => {
        const isChecked = !!userStep.subtasks[idx];
        const label = document.createElement("label");
        label.className = "check-label";
        label.innerHTML = `
          <input type="checkbox" class="check-input" ${isChecked ? 'checked' : ''} 
                 onchange="toggleSubtask('${step.id}', ${idx}, this.checked)">
          <span class="check-text">${escapeHTML(itemText)}</span>
        `;
        checklistContainer.appendChild(label);
      });

      // Notes area
      const notesLabel = document.createElement("label");
      notesLabel.className = "step-notes-label";
      notesLabel.textContent = "Execution Logs & Deployment URLs";

      const notesTextarea = document.createElement("textarea");
      notesTextarea.className = "step-notes-input";
      notesTextarea.placeholder = "e.g., DNS propagation verified at 14:00; Google Search Console token uploaded...";
      notesTextarea.value = userStep.notes || "";
      notesTextarea.oninput = (e) => updateStepNotes(step.id, e.target.value);

      body.appendChild(instructions);
      body.appendChild(subHeader);
      body.appendChild(checklistContainer);
      body.appendChild(notesLabel);
      body.appendChild(notesTextarea);

      card.appendChild(header);
      card.appendChild(body);
      container.appendChild(card);
    });

    calculateReadiness();
  }

  function escapeHTML(str) {
    if (!str) return '';
    return str.replace(/[&<>'"]/g, tag => ({
      '&': '&amp;',
      '<': '&lt;',
      '>': '&gt;',
      "'": '&#39;',
      '"': '&quot;'
    }[tag] || tag));
  }

  /* ==========================================================================
     JSON EXPORT & RESTORE ENGINE
     ========================================================================== */
  function exportDataJSON() {
    const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(AppState, null, 2));
    const a = document.createElement("a");
    const dateStamp = new Date().toISOString().split('T')[0];
    a.setAttribute("href", dataStr);
    a.setAttribute("download", `launch-procedures-backup-${dateStamp}.json`);
    document.body.appendChild(a);
    a.click();
    a.remove();
  }

  function triggerImport() {
    document.getElementById("import-file-input").click();
  }

  function importDataJSON(event) {
    const file = event.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = function(e) {
      try {
        const parsed = JSON.parse(e.target.result);
        if (!parsed.tabs) {
          alert("Invalid backup schema. Unable to restore.");
          return;
        }
        AppState = parsed;
        localStorage.setItem(STORAGE_KEY, JSON.stringify(AppState));
        setPalette(AppState.palette || "espresso");
        renderTabs();
        renderActiveTabContent();
        alert("Launch operator state restored successfully!");
      } catch (err) {
        alert("Failed to parse JSON backup file: " + err.message);
      }
    };
    reader.readAsText(file);
    event.target.value = "";
  }

  /* ==========================================================================
     INITIAL LAUNCH SEQUENCE
     ========================================================================== */
  document.addEventListener("DOMContentLoaded", () => {
    setPalette(AppState.palette || "espresso");
    renderTabs();
    renderActiveTabContent();
  });
</script>

</body>
</html>
